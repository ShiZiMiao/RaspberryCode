packages:
  - apps/dev-docs
  - packages/*
  - apps/raspberrycode-cli
  - apps/raspberrycode-cli/packages/*
  - apps/raspberrycode-cli/tools/*
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  # Modified for RaspberryCode: 构建脚本经 reg.exe 探测 VS（本机安全策略黑名单拦截），
  # 且仅是 ssh2 的可选 CPU 特性探测模块，跳过不影响功能。
  cpu-features: false
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
