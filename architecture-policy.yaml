version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: windows-runtime-host
    roots:
      - packages/services/src/windows-runtime-host
    managed: true
    requires: [services]
    publicEntrypoints:
      - packages/services/src/windows-runtime-host/index.ts
      - packages/services/src/windows-runtime-host/contract.ts
    layers:
      adapters: .
    owner: runtime
  - id: session-control
    roots: [packages/session-control/src, packages/session-control/vitest.config.ts]
    managed: true
    requires: []
    publicEntrypoints:
      - packages/session-control/src/contract.ts
      - packages/session-control/src/application/cli/index.ts
      - packages/session-control/src/application/app/index.ts
      - packages/session-control/src/testing/index.ts
    layers: {contract: contract, domain: domain, app: application}
    owner: conversation
  - id: app-control-protocol
    roots: [packages/shared/src/app-control]
    managed: true
    requires: [session-control]
    publicEntrypoints:
      - packages/shared/src/app-control/index.ts
      - packages/shared/src/app-control/contract.ts
    layers: {contract: .}
    owner: conversation
  - id: app-control
    roots: [packages/services/src/app-control]
    managed: true
    requires: [session-control, shared, services, session, project, project-storage, provider, remote-projects]
    publicEntrypoints:
      - packages/services/src/app-control/index.ts
      - packages/services/src/app-control/contract.ts
      - packages/services/src/app-control/discovery-directory.ts
    layers: {adapters: .}
    owner: conversation
  - id: cli-session-control-tools
    roots: [apps/raspberrycode-cli/packages/core/src/tool/session-control]
    managed: true
    requires: [session-control, raspberrycode-cli]
    publicEntrypoints:
      - apps/raspberrycode-cli/packages/core/src/tool/session-control/contract.ts
      - apps/raspberrycode-cli/packages/core/src/tool/session-control/index.ts
    layers: {app: .}
    owner: agent
  - id: cli-session-control-bootstrap
    roots: [apps/raspberrycode-cli/packages/bootstrap/src/session-control]
    managed: true
    requires: [session-control, app-control-protocol, shared, raspberrycode-cli, cli-session-control-tools]
    publicEntrypoints:
      - apps/raspberrycode-cli/packages/bootstrap/src/session-control/contract.ts
      - apps/raspberrycode-cli/packages/bootstrap/src/session-control/index.ts
    layers: {adapters: .}
    owner: agent
  - id: cli-session-control-runtime
