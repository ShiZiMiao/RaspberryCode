    publicEntrypoints:
      - apps/raspberrycode-cli/packages/bootstrap/src/cli-session-control/contract.ts
      - apps/raspberrycode-cli/packages/bootstrap/src/cli-session-control/index.ts
    layers: {adapters: .}
    owner: agent
  - id: cli-active-transcript
    roots: [apps/raspberrycode-cli/packages/bootstrap/src/active-transcript]
    managed: true
    requires: [shared, raspberrycode-cli]
    publicEntrypoints:
